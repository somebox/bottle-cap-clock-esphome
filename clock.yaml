# ----------------------------------------------------------------------------
# Bottle Cap Clock - ESPHome configuration
#
# A 4-digit + colon clock built from 65 bottle-cap "pixels" wired as one
# WS2812 strip (3 LEDs per cap, 195 LEDs total) on a custom ESP32-S3 board.
#
# Hardware pinout (override with substitutions below if your wiring differs):
#   GPIO2   Heartbeat LED
#   GPIO6   User button (active low, internal pull-up)
#   GPIO8   I2C SDA (BH1750 ambient light sensor)
#   GPIO9   I2C SCL
#   GPIO16  Addressable LED data line (WS2812, 195 LEDs)
#
# This file follows the ESPHome "Made for ESPHome" / sharing guidelines so a
# kit owner can flash it from the dashboard and provision Wi-Fi without
# editing YAML. See README.md for the end-user setup flow.
# ----------------------------------------------------------------------------

substitutions:
  name: "bottle-cap-clock"
  friendly_name: "Bottle Cap Clock"
  # Project version - bump on every release so OTA updates show up correctly
  # in the ESPHome dashboard / Home Assistant.
  project_version: "1.3.0"
  # IANA tz database name. See:
  # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "Europe/Berlin"
  # Hardware pins. Override here if you re-wire the board.
  led_pin: GPIO16
  heartbeat_pin: GPIO2
  button_pin: GPIO6
  i2c_sda_pin: GPIO8
  i2c_scl_pin: GPIO9

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  # Append the chip MAC to the hostname so multiple kits coexist on a network
  # without renaming each one.
  name_add_mac_suffix: true
  # Project metadata. Required for ESPHome dashboard adoption.
  project:
    name: "bottlecapclock.esphome"
    version: "${project_version}"
  on_boot:
    priority: -100
    then:
      # Quick double blink of the heartbeat LED so you can see the firmware
      # actually started, even before Wi-Fi / network come up. Dim level
      # matches the steady-state heartbeat.
      - output.set_level:
          id: heartbeat_led
          level: 3%
      - delay: 150ms
      - output.turn_off: heartbeat_led
      - delay: 150ms
      - output.set_level:
          id: heartbeat_led
          level: 3%
      - delay: 150ms
      - output.turn_off: heartbeat_led
      # Force the clock effect on boot so the strip doesn't get stuck on a
      # diagnostic effect (Cap Walk / Digit Test) from a previous session.
      # Brightness is intentionally pinned at 100% here: the addressable
      # light framework would otherwise multiply the framebuffer by the
      # light's brightness via local_brightness in ESPColorCorrection,
      # crushing our sub-pixel-ladder output (B=1/2/3) to PWM 0. We
      # apply our own dimming in the display lambda instead, sourcing
      # the level from the display_b global.
      - light.turn_on:
          id: clock_leds
          effect: "Clock Display"
      - light.turn_on:
          id: clock_leds
          brightness: 100%
          transition_length: 0s
      # Defensive clamp: on first boot after a firmware upgrade the
      # preferences slot for a newly-added global can come back as 0.0
      # instead of initial_value. Clamp to the entity's valid range
      # before we sync the number entities below.
      - lambda: |-
          if (id(dim_lux) < 0.5f || id(dim_lux) > 50.0f) {
            id(dim_lux) = 5.0f;
          }
          if (id(bright_lux) < 50.0f || id(bright_lux) > 2000.0f) {
            id(bright_lux) = 200.0f;
          }
          if (id(brightness_offset) < -2.0f || id(brightness_offset) > 2.0f) {
            id(brightness_offset) = 0.0f;
          }
          if (id(max_brightness) < 0.3f || id(max_brightness) > 1.0f) {
            id(max_brightness) = 0.85f;
          }
      # Sync the user-facing number entities from their backing globals.
      # The globals own persistence (reliable across reboots/OTAs); the
      # entities are initialised from them here so HA sees the correct
      # value immediately on connect.
      - number.set:
          id: dim_lux_number
          value: !lambda 'return id(dim_lux);'
      - number.set:
          id: bright_lux_number
          value: !lambda 'return id(bright_lux);'
      - number.set:
          id: brightness_offset_number
          value: !lambda 'return id(brightness_offset);'
      - number.set:
          id: max_brightness_number
          value: !lambda 'return id(max_brightness);'
      # Wait a few seconds so the API/HA connection has had time to come up,
      # then announce why the previous run ended. We log at WARN level (so it
      # shows up in `esphome logs` even without HA) and publish to the
      # diagnostic text sensor (so it lands in HA history).
      - delay: 5s
      - lambda: |-
          const char *reason;
          switch (esp_reset_reason()) {
            case ESP_RST_POWERON:   reason = "Power-on"; break;
            case ESP_RST_EXT:       reason = "External reset"; break;
            case ESP_RST_SW:        reason = "Software reset (OTA / restart)"; break;
            case ESP_RST_PANIC:     reason = "Exception / panic"; break;
            case ESP_RST_INT_WDT:   reason = "Interrupt watchdog"; break;
            case ESP_RST_TASK_WDT:  reason = "Task watchdog"; break;
            case ESP_RST_WDT:       reason = "Other watchdog"; break;
            case ESP_RST_DEEPSLEEP: reason = "Deep sleep wake"; break;
            case ESP_RST_BROWNOUT:  reason = "Brownout"; break;
            case ESP_RST_SDIO:      reason = "SDIO reset"; break;
            default:                reason = "Unknown"; break;
          }
          ESP_LOGW("boot", "Last reset reason: %s (code %d)", reason, (int) esp_reset_reason());
          id(last_reset_reason).publish_state(reason);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: arduino

# ESP32-S3-WROOM-1-N16R2 has 2 MB of *quad* SPI PSRAM (the R2 part).
# A previous "octal" setting silently failed to init (Available: NO in the
# boot log), which can destabilise Wi-Fi/BLE buffers. The strip framebuffer
# stays in SRAM (use_psram: false on the light) for deterministic timing;
# everything else can use PSRAM if it wants.
psram:
  mode: quad
  speed: 80MHz

logger:

# Native API for Home Assistant.
api:

# Over-the-air updates after the first USB flash.
ota:
  - platform: esphome
    id: ota_esphome

# Wi-Fi provisioning: device starts in AP mode if no credentials are saved.
# Connect a phone to the AP, the captive portal opens, and you enter your
# real Wi-Fi credentials. Improv (serial + BLE) provides the same flow from
# the ESPHome web tools or any Improv-compatible app.
#
# For local development you can hardcode credentials by replacing the AP
# block with:
#
#     ssid: !secret wifi_ssid
#     password: !secret wifi_password
#     ap:
#       ssid: "${friendly_name}"
#
# and creating secrets.yaml from secrets.yaml.example.
wifi:
  ap:
    ssid: "${friendly_name}"

captive_portal:

improv_serial:

# esp32_improv (BLE-based Wi-Fi provisioning) is intentionally disabled here.
# It pulls in the full BLE stack which, alongside Wi-Fi + RMT DMA + 50 ms
# addressable lambda + web_server + api on the Arduino framework, is a known
# source of ~60 s reboot loops on the ESP32-S3. improv_serial above already
# covers USB-based provisioning. Re-enable only if you need wireless
# first-time provisioning and have verified stability on your build.
# esp32_improv:
#   authorizer: none

# Dashboard adoption. Point package_import_url at the public raw URL of this
# file in your fork so users can adopt the device with one click from the
# ESPHome dashboard. Leave as-is for the upstream repo.
dashboard_import:
  package_import_url: github://bottlecapclock/bottle-cap-clock-esphome/clock.yaml@main
  import_full_config: false

# Web UI on http://<device-ip>/ for direct control without Home Assistant.
web_server:
  port: 80

i2c:
  id: bus_a
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

# Heartbeat LED + 1 Hz blink so the user can tell the device is alive even
# when the clock display is intentionally dim or off. Driven via LEDC so
# we can run it at a low duty cycle -- the onboard LED at full drive is
# distractingly bright in a dim room.
output:
  - platform: ledc
    id: heartbeat_led
    pin: ${heartbeat_pin}
    frequency: 1000Hz

interval:
  - id: heartbeat_interval
    interval: 1s
    then:
      - output.set_level:
          id: heartbeat_led
          level: 3%
      - delay: 150ms
      - output.turn_off: heartbeat_led

binary_sensor:
  - platform: gpio
    name: "User Button"
    id: user_button
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true

# Diagnostic sensors. These are entity_category: diagnostic so they don't
# clutter the main UI but show up in the device's diagnostics panel and HA's
# device page. Useful for catching crashes, brownouts, RF problems.
text_sensor:
  - platform: version
    name: "ESPHome Version"
    id: esphome_version
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
  # Populated by on_boot a few seconds after start (when the API is up).
  # The value visible in HA history right after a reboot tells us *why* the
  # previous run ended (panic, watchdog, brownout, etc.).
  - platform: template
    name: "Last Reset Reason"
    id: last_reset_reason
    icon: "mdi:restart-alert"
    entity_category: diagnostic
    update_interval: never

# BH1750 ambient light sensor. When "Auto Brightness" is on, raw 1 Hz
# samples feed a 10 s exponential filter (last_lux global), and that
# smoothed value drives a three-region curve (see apply_auto_brightness):
# a log-quantised dark band that walks B=1/2/3 below "Dim Lux", a
# log-linear lit ramp up to "Bright Lux", and a hard ceiling at
# "Max Brightness". The published Ambient Light entity uses an
# independent median + 30 s throttle so HA history stays clean.
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s
    entity_category: diagnostic
  - platform: internal_temperature
    name: "Internal Temperature"
    id: internal_temp
    update_interval: 60s
    entity_category: diagnostic
  - platform: template
    name: "Free Heap"
    id: free_heap
    lambda: 'return ESP.getFreeHeap();'
    update_interval: 30s
    unit_of_measurement: "B"
    accuracy_decimals: 0
    icon: "mdi:memory"
    entity_category: diagnostic
  # Display frame rate. Incremented inside the Clock Display effect
  # lambda (see fps_counter global). The Cap Walk / Digit Test
  # diagnostic effects do not increment, so this reads 0 in those
  # modes -- which is what you want, the meaningful FPS number is
  # for normal display.
  - platform: template
    name: "Clock FPS"
    id: clock_fps_sensor
    icon: "mdi:speedometer"
    unit_of_measurement: "fps"
    accuracy_decimals: 1
    update_interval: 5s
    entity_category: diagnostic
    lambda: |-
      static uint32_t s_last_ms = 0;
      uint32_t now = millis();
      uint32_t count = id(fps_counter);
      id(fps_counter) = 0;
      if (s_last_ms == 0) {
        s_last_ms = now;
        return NAN;
      }
      uint32_t dt = now - s_last_ms;
      s_last_ms = now;
      if (dt == 0) return 0.0f;
      return (float) count * 1000.0f / (float) dt;
  - platform: bh1750
    name: "Ambient Light"
    id: ambient_light
    address: 0x23
    # Sample at 1 Hz (the BH1750's H-resolution measurement is ~120 ms,
    # so 1 s is comfortable). The 1 Hz rate is for our LOCAL pipeline:
    # auto-brightness reacts within a couple of seconds. The PUBLISHED
    # entity is decimated below to ~30 s so HA history stays clean.
    update_interval: 1s
    filters:
      # Median + throttle here only affects the value pushed to the API
      # / HA recorder. on_raw_value below feeds the local EMA from the
      # raw 1 Hz samples directly.
      - median:
          window_size: 10
          send_every: 30
          send_first_at: 1
      - throttle: 30s
    # Pre-filter: feed every raw 1 Hz sample into a single-pole
    # exponential filter so auto-brightness tracks sustained ambient
    # and ignores transient shadows / brief reflections.
    #
    #   alpha = 1 - exp(-dt / tau);  dt = 1 s, tau = 10 s
    #
    # That settles to ~95 % of a step change in ~30 s, which feels
    # immediate for things like flipping room lights on, while still
    # filtering out a person walking past the sensor.
    on_raw_value:
      then:
        - lambda: |-
            const float TAU_S = 10.0f;
            const float DT_S  = 1.0f;
            const float alpha = 1.0f - expf(-DT_S / TAU_S);
            if (id(last_lux) < 0.0f) {
              id(last_lux) = x;
            } else {
              id(last_lux) += alpha * (x - id(last_lux));
            }
        - script.execute: apply_auto_brightness

  # Clock Brightness: numeric sensor that mirrors the light's actual
  # brightness on the 0..255 scale that HA exposes on light entities.
  # Recorded by HA so you can plot it against Ambient Light over days
  # and tune Dim Lux / Bright Lux / Brightness Offset from history.
  #
  # Updated two ways:
  #   - pushed from apply_auto_brightness on every fresh target (no
  #     aliasing with the polling interval, no transition lag);
  #   - polled here every 30 s as a heartbeat so manual brightness
  #     changes from the HA slider still land in the recorder.
  - platform: template
    name: "Clock Brightness"
    id: clock_brightness_sensor
    icon: "mdi:brightness-percent"
    accuracy_decimals: 0
    update_interval: 30s
    # Local updates run at 1 Hz (synchronous publish from
    # apply_auto_brightness). The throttle filter below decimates that
    # to the API / recorder so HA only sees one sample every 30 s --
    # enough to plot trends, not enough to flood the recorder.
    filters:
      - throttle: 30s
    lambda: |-
      if (!id(clock_leds).remote_values.is_on()) return 0.0f;
      return roundf(id(display_b) * 255.0f);

# Recomputes display_b from the smoothed last_lux through the
# three-region curve (Dim Lux / Bright Lux / Brightness Offset),
# capped by Max Brightness. Called whenever a fresh lux sample
# arrives, when any of the auto-brightness sliders move, or when
# Auto Brightness is toggled on.
#
# Guards:
#   - Auto Brightness switch must be on.
#   - The light must already be on (remote_values.is_on()). Without this
#     guard, any lux sample arriving after the user hit Turn Off would
#     silently turn the light back on via set_brightness().
script:
  - id: apply_auto_brightness
    mode: restart
    then:
      - if:
          condition:
            and:
              - switch.is_on: auto_brightness_switch
              - lambda: 'return id(clock_leds).remote_values.is_on();'
          then:
            - lambda: |-
                // Three-region auto-brightness curve.
                //
                //   Dark band : lux in [0, dim_lux]
                //               B walks 1 -> 2 -> 3 (log-quantised).
                //               Each band is one third of the
                //               [dim_lux/10, dim_lux] log range, so
                //               B=1/2/3 each get a meaningful slice
                //               of the room's truly-dim time. This
                //               band is INVARIANT to the offset --
                //               the napping-room floor is sacred.
                //
                //   Lit ramp  : lux in [dim_lux, bright_lux]
                //               B = 3..255, linear in log(lux).
                //               Each doubling of lux is roughly the
                //               same brightness step.
                //
                //   Saturated : lux >= bright_lux
                //               B = 255, then capped by max_b.
                //
                // Knobs:
                //   * dim_lux   - top of the dark band. Move up so
                //                 evenings sit higher on the 1/2/3
                //                 ladder; move down so the climb
                //                 starts sooner.
                //   * bright_lux - lux at which the lit ramp hits
                //                  max. Move up for sunlit rooms
                //                  with lots of headroom; move down
                //                  so cloudy daytime hits full.
                //   * brightness_offset - additive gain in stops on
                //                         the LIT ramp output only
                //                         (does not touch the dark
                //                         band).
                //   * max_b - hard ceiling (manual + auto).
                //
                // Examples at dim=5, bright=200, offset=0, max=1.0:
                //   lux=0     -> B=1     lux=0.5  -> B=2
                //   lux=1.6   -> B=3     lux=5    -> B=3
                //   lux=10    -> B=22    lux=50   -> B=124
                //   lux=100   -> B=189   lux=200+ -> B=255
                const float FLOOR_B = 1.0f / 255.0f;   // B=1
                const float B3      = 3.0f / 255.0f;
                const float LUX_EPS = 1e-3f;           // EPS collides with xtensa specreg.h

                float lux = id(last_lux);
                if (lux < 0.0f) lux = 0.0f;

                float dim_l = id(dim_lux);
                if (dim_l < 0.5f) dim_l = 0.5f;
                float bright_l = id(bright_lux);
                if (bright_l <= dim_l) bright_l = dim_l + 1.0f;

                float target;
                if (lux <= dim_l) {
                  // Dark band: log-quantise into B=1, 2, 3 across
                  // [dim_l/10, dim_l].
                  float night_l = dim_l / 10.0f;
                  float lo = logf(night_l + LUX_EPS);
                  float hi = logf(dim_l   + LUX_EPS);
                  float t  = (logf(lux + LUX_EPS) - lo) / (hi - lo);
                  if (t < 0.0f) t = 0.0f;
                  if (t > 1.0f) t = 1.0f;
                  int step = (int) (t * 3.0f);
                  if (step > 2) step = 2;
                  target = (1.0f + (float) step) / 255.0f;
                } else {
                  // Lit ramp: linear in log(lux) from B=3 to B=255.
                  float t;
                  if (lux >= bright_l) {
                    t = 1.0f;
                  } else {
                    t = (logf(lux) - logf(dim_l))
                      / (logf(bright_l) - logf(dim_l));
                  }
                  target = B3 + t * (1.0f - B3);
                  // Brightness Offset: pure trim of the lit ramp
                  // (doesn't lift the dark band).
                  target *= powf(2.0f, id(brightness_offset));
                  if (target < B3) target = B3;
                }

                float max_b = id(max_brightness);
                if (target > max_b) target = max_b;
                // Own dimming via display_b. The display lambda reads
                // this on its 50 ms tick. We do NOT call
                // set_brightness on the light: that would route our
                // value through addressable_light's color correction
                // (local_brightness = max_brightness * brightness),
                // double-applying the dim and crushing B<=~16 to PWM
                // 0 via scale8_twice rounding. Instead, the light
                // stays pinned at 100% (see on_boot / on_turn_on /
                // brightness-bounce in the light's on_state) and the
                // framework correction becomes a no-op.
                id(display_b) = target;
                // Record the commanded brightness on HA's 0..255
                // scale so it lands in the recorder synchronously,
                // not aliased against the 30 s sensor heartbeat.
                id(clock_brightness_sensor)
                    ->publish_state(roundf(target * 255.0f));

# Persistent runtime state. The select / switch / number entities below are
# the user-facing controls; these globals hold the cached values used by the
# per-frame display lambda.
globals:
  # rotate_180 and clock_mode mirror their switch / select entities so the
  # per-frame display lambda can branch without going through the entity
  # layer. The entities own persistence; the globals are re-synced from
  # them on boot via turn_on/turn_off_action / on_value.
  - id: rotate_180
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: clock_mode
    type: int
    restore_value: false
    initial_value: '0'
  # The auto-brightness knobs OWN their persistence here (globals'
  # restore_value is reliable across reboots/OTAs). The matching number
  # entities are synced FROM these on boot and write back here on change.
  #
  # dim_lux     - top of the dark band (B walks 1->2->3 below this).
  # bright_lux  - lux at which the lit ramp reaches B=255.
  # brightness_offset - trim in stops applied to the lit ramp only.
  # max_brightness - hard ceiling on commanded brightness.
  - id: dim_lux
    type: float
    restore_value: true
    initial_value: '5.0'
  - id: bright_lux
    type: float
    restore_value: true
    initial_value: '200.0'
  - id: brightness_offset
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: max_brightness
    type: float
    restore_value: true
    initial_value: '0.85'
  # Smoothed lux for the auto-brightness path. Initialised to a sentinel
  # so the first BH1750 sample seeds the EMA directly instead of being
  # dragged from a fake initial value.
  - id: last_lux
    type: float
    restore_value: false
    initial_value: '-1.0'
  # Effective display brightness on a 0..1 scale. The display lambda
  # uses this directly (B = round(display_b * 255)) instead of reading
  # current_values.get_brightness(), so the addressable_light
  # framework's color_correction (which would otherwise multiply our
  # framebuffer by the light's current brightness, crushing the
  # B=1/2/3 sub-pixel ladder to PWM 0) is bypassed: we keep the light
  # itself pinned at 100% brightness and own the dimming here.
  - id: display_b
    type: float
    restore_value: false
    initial_value: '0.0625'
  # Frame counter incremented once per Clock Display effect tick.
  # The Clock FPS template sensor below samples and resets it.
  - id: fps_counter
    type: uint32_t
    restore_value: false
    initial_value: '0'

switch:
  - platform: template
    name: "Rotate 180"
    id: rotate_180_switch
    icon: "mdi:rotate-3d-variant"
    # The switch itself persists across reboots/reflashes (entity-id-keyed
    # preference, stable across firmware structure changes). On boot ESPHome
    # restores the saved state and replays turn_on/turn_off_action, which
    # re-syncs the rotate_180 global used by the display lambda.
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - globals.set:
          id: rotate_180
          value: 'true'
    turn_off_action:
      - globals.set:
          id: rotate_180
          value: 'false'
  - platform: template
    name: "Auto Brightness"
    id: auto_brightness_switch
    icon: "mdi:brightness-auto"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # The script reads the switch state directly, so no global mirror is
    # needed. On turn_on we kick the script so it applies the current
    # lux immediately (guarded: no-op if the light is off).
    turn_on_action:
      - script.execute: apply_auto_brightness

number:
  # All four sliders store their state in the matching global (see
  # globals: block). The on_value handler writes through to the global,
  # and on_boot pushes the restored global back into the entity.
  - platform: template
    name: "Dim Lux"
    id: dim_lux_number
    icon: "mdi:weather-night"
    optimistic: true
    min_value: 0.5
    max_value: 50
    step: 0.5
    mode: slider
    # Top of the dark band. At or below this lux the clock sits at one
    # of B=1/2/3 (1, 2, or 3 LEDs per cap at PWM 1) chosen log-wise.
    # Raise so dim rooms still get all 3 LEDs lit before the climb;
    # lower so the climb starts sooner.
    on_value:
      then:
        - globals.set:
            id: dim_lux
            value: !lambda 'return x;'
        - script.execute: apply_auto_brightness

  - platform: template
    name: "Bright Lux"
    id: bright_lux_number
    icon: "mdi:weather-sunny"
    optimistic: true
    min_value: 50
    max_value: 2000
    step: 10
    mode: slider
    # Lux at which the lit ramp reaches max brightness. Below this the
    # clock interpolates linearly in log(lux) from B=3 (at dim_lux) up
    # to B=255 (at bright_lux). Raise for sunlit rooms with lots of
    # daytime headroom; lower so cloudy daytime hits full brightness.
    on_value:
      then:
        - globals.set:
            id: bright_lux
            value: !lambda 'return x;'
        - script.execute: apply_auto_brightness

  - platform: template
    name: "Brightness Offset"
    id: brightness_offset_number
    icon: "mdi:tune-vertical"
    optimistic: true
    min_value: -2.0
    max_value: 2.0
    step: 0.1
    mode: slider
    unit_of_measurement: "EV"
    # Pure trim of the lit ramp output, in stops (powers of 2).
    # +1 doubles the brightness everywhere on the lit ramp; -1 halves
    # it. The dark band is intentionally INVARIANT to this knob, so a
    # truly dark room never glows brighter just because you nudged the
    # daytime trim.
    on_value:
      then:
        - globals.set:
            id: brightness_offset
            value: !lambda 'return x;'
        - script.execute: apply_auto_brightness

  - platform: template
    name: "Max Brightness"
    id: max_brightness_number
    icon: "mdi:car-speed-limiter"
    optimistic: true
    min_value: 0.30
    max_value: 1.00
    step: 0.05
    mode: slider
    # Hard cap applied in the display lambda: if user_brightness exceeds
    # max, output colors are scaled by (max / user_brightness). Caps auto
    # and manual brightness alike without dimming below-max settings.
    on_value:
      then:
        - globals.set:
            id: max_brightness
            value: !lambda 'return x;'
        - script.execute: apply_auto_brightness

select:
  - platform: template
    name: "Clock Mode"
    id: clock_mode_select
    icon: "mdi:palette"
    optimistic: true
    restore_value: true
    options:
      - "Mono"
      - "Rainbow"
      - "Bicolor"
      - "Waves"
    initial_option: "Mono"
    on_value:
      then:
        - lambda: |-
            if      (x == "Mono")    id(clock_mode) = 0;
            else if (x == "Rainbow") id(clock_mode) = 1;
            else if (x == "Bicolor") id(clock_mode) = 2;
            else if (x == "Waves")   id(clock_mode) = 3;

# ----------------------------------------------------------------------------
# LED strip
#
# Layout along the data line (65 caps, 3 LEDs per cap, 195 LEDs total):
#   digit0 (15 caps)  digit1 (15)  colon (5)  digit2 (15)  digit3 (15)
#
# Each digit's caps are wired column-serpentine:
#   col 0 top -> bottom    (caps 0..4 within the digit)
#   col 1 bottom -> top    (caps 5..9)
#   col 2 top -> bottom    (caps 10..14)
# ROW_COL_TO_CAP encodes that mapping. See README for the visual diagram.
# ----------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    name: "Clock LEDs"
    id: clock_leds
    pin: ${led_pin}
    chipset: WS2812
    rgb_order: GRB
    num_leds: 195
    default_transition_length: 0s
    gamma_correct: 1.0
    # Persist the user's chosen color and brightness across reboots.
    restore_mode: RESTORE_DEFAULT_ON
    # Light effects don't persist across off/on, so HA would otherwise
    # show a blank strip after toggling off and back on. Auto-select
    # Clock Display whenever the light comes on with no effect active;
    # the guard keeps user-selected diagnostic effects (Cap Walk, Digit
    # Test) intact.
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(clock_leds).get_effect_name() == "None";'
          then:
            - light.turn_on:
                id: clock_leds
                effect: "Clock Display"
      # Pin the framework brightness at 100%. We dim entirely in the
      # display lambda via display_b; routing dimming through the
      # light's brightness would double-apply the scale via
      # addressable_light's color correction and crush the B=1/2/3
      # dark-band floor to PWM 0.
      - light.turn_on:
          id: clock_leds
          brightness: 100%
          transition_length: 0s
    # If anything (HA slider, restore from preferences, OTA-time
    # transient) drops the framework brightness below 100% while the
    # light is on, snap it back. This keeps color_correction's
    # local_brightness pinned at 255, so the framebuffer reaches the
    # WS2812 strip unmolested.
    on_state:
      - if:
          condition:
            lambda: |-
              return id(clock_leds).remote_values.is_on() &&
                     id(clock_leds).remote_values.get_brightness() < 0.999f;
          then:
            - light.turn_on:
                id: clock_leds
                brightness: 100%
                transition_length: 0s
    # ESP32-S3 timing: stream via DMA so Wi-Fi / scheduler interrupts can't
    # cause RMT buffer underruns mid-frame. rmt_symbols is the DMA chunk size
    # in bits; 1024 is the largest the new ESP-IDF RMT TX driver accepts here.
    # use_psram: false keeps the framebuffer in SRAM for deterministic access.
    use_dma: true
    rmt_symbols: 1024
    use_psram: false
    effects:
      # Diagnostic: walk one cap at a time through all 65 caps, 1.5s per step,
      # logging the cap index. Use this if you suspect a wiring or mapping
      # issue - it lets you read off the physical-to-logical cap order.
      - addressable_lambda:
          name: "Cap Walk"
          update_interval: 1500ms
          lambda: |-
            static const int LEDS_PER_CAP = 3;
            static const int NUM_LEDS = 195;
            static const int NUM_CAPS = 65;
            static int s_cap = 0;

            Color off = Color(0, 0, 0);
            Color on = Color(40, 40, 40);

            for (int i = 0; i < NUM_LEDS; i++) {
              it[i] = off;
            }
            int base = s_cap * LEDS_PER_CAP;
            it[base + 0] = on;
            it[base + 1] = on;
            it[base + 2] = on;

            ESP_LOGI("cap_walk", "cap=%d  leds=%d,%d,%d",
                     s_cap, base, base + 1, base + 2);
            s_cap = (s_cap + 1) % NUM_CAPS;

      # Diagnostic: cycle a single digit (0..9) on all four positions.
      # Useful for verifying the digit bitmap and (row, col) -> cap map
      # without depending on SNTP or color modes.
      - addressable_lambda:
          name: "Digit Test"
          update_interval: 1000ms
          lambda: |-
            static const uint8_t ROW_COL_TO_CAP[5][3] = {
                {0, 9, 10},
                {1, 8, 11},
                {2, 7, 12},
                {3, 6, 13},
                {4, 5, 14},
            };
            static const char *const DIGITS[10][5] = {
                {"111", "101", "101", "101", "111"},  // 0
                {"001", "001", "001", "001", "001"},  // 1
                {"111", "001", "111", "100", "111"},  // 2
                {"111", "001", "111", "001", "111"},  // 3
                {"101", "101", "111", "001", "001"},  // 4
                {"111", "100", "111", "001", "111"},  // 5
                {"111", "100", "111", "101", "111"},  // 6
                {"111", "001", "001", "001", "001"},  // 7
                {"111", "101", "111", "101", "111"},  // 8
                {"111", "101", "111", "001", "111"},  // 9
            };
            static const int DIGIT_OFFSET[4] = {0, 15, 35, 50};
            static const int LEDS_PER_CAP = 3;

            static int s_value = 0;
            int n = s_value;
            s_value = (s_value + 1) % 10;

            it.all() = Color(0, 0, 0);
            for (int d = 0; d < 4; d++) {
              int offset = DIGIT_OFFSET[d];
              for (int row = 0; row < 5; row++) {
                for (int col = 0; col < 3; col++) {
                  if (DIGITS[n][row][col] == '1') {
                    int cap = offset + ROW_COL_TO_CAP[row][col];
                    int base = cap * LEDS_PER_CAP;
                    it[base + 0] = current_color;
                    it[base + 1] = current_color;
                    it[base + 2] = current_color;
                  }
                }
              }
            }

      # Normal clock display: HH:MM driven by SNTP, colon fades at 0.5 Hz.
      # Caches the last valid time so a brief SNTP desync doesn't blank the
      # display. Coloring depends on the active Clock Mode (see select).
      - addressable_lambda:
          name: "Clock Display"
          # 50 ms = 20 fps. Smooth enough that the Waves mode's 1.2 s
          # sinusoid and the colon fade look continuous. use_dma: true +
          # rmt_symbols: 1024 (see below) give the RMT pipeline enough
          # headroom that Wi-Fi / API interrupts don't disturb the frame.
          update_interval: 50ms
          lambda: |-
            // Frame counter for the Clock FPS sensor. The sensor's
            // template lambda samples and resets this every 5 s.
            id(fps_counter)++;

            static const uint8_t ROW_COL_TO_CAP[5][3] = {
                {0, 9, 10},
                {1, 8, 11},
                {2, 7, 12},
                {3, 6, 13},
                {4, 5, 14},
            };
            static const char *const DIGITS[10][5] = {
                {"111", "101", "101", "101", "111"},  // 0
                {"001", "001", "001", "001", "001"},  // 1
                {"111", "001", "111", "100", "111"},  // 2
                {"111", "001", "111", "001", "111"},  // 3
                {"101", "101", "111", "001", "001"},  // 4
                {"111", "100", "111", "001", "111"},  // 5
                {"111", "100", "111", "101", "111"},  // 6
                {"111", "001", "001", "001", "001"},  // 7
                {"111", "101", "111", "101", "111"},  // 8
                {"111", "101", "111", "001", "111"},  // 9
            };
            static const int DIGIT_OFFSET[4] = {0, 15, 35, 50};
            static const int COLON_OFFSET = 30;
            static const int LEDS_PER_CAP = 3;

            // Visible left-to-right column for spatial modes:
            //   digit 0 -> 0..2   digit 1 -> 3..5   colon -> 6
            //   digit 2 -> 7..9   digit 3 -> 10..12   width = 13
            static const int DIGIT_X_OFFSET[4] = {0, 3, 7, 10};
            static const int COLON_X = 6;
            static const float DISPLAY_W = 13.0f;

            static int s_hour = 0;
            static int s_minute = 0;
            static bool s_have_time = false;

            auto now = id(sntp_time).now();
            if (now.is_valid()) {
              s_hour = now.hour;
              s_minute = now.minute;
              s_have_time = true;
            }

            it.all() = Color(0, 0, 0);
            if (!s_have_time) {
              return;
            }

            int digits[4] = {
              s_hour / 10,
              s_hour % 10,
              s_minute / 10,
              s_minute % 10,
            };

            // Sub-pixel dimming: each cap has 3 LEDs and a uint8_t PWM per
            // channel, so the dimmest "all-3-on" state is (1,1,1) across
            // the cap. Below that we can still represent 2 useful steps
            // by lighting only 1 or 2 of the 3 LEDs. FC carries the
            // intended per-LED colour as floats so values below 1 survive
            // until paint_cap decides how to distribute them.
            struct FC { float r, g, b; };
            auto paint_cap = [&](int cap, FC c) {
              int base = cap * LEDS_PER_CAP;
              Color off_c(0, 0, 0);
              float max_c = fmaxf(c.r, fmaxf(c.g, c.b));
              int n;
              float scale;
              if (max_c < 1.0f / 255.0f) {
                // Truly-zero colour (e.g. colon at fade=0). Anything
                // above this gets at least 1 LED at PWM 1 via the
                // sub-pixel branch below -- that's the dark-room
                // floor the auto-brightness curve relies on, and we
                // must not blank caps just because mode/colour math
                // pulled max_c below half a sub-pixel step.
                n = 0;
                scale = 0.0f;
              } else if (max_c >= 1.0f) {
                // Normal path: trust the colour, paint all 3 LEDs.
                n = LEDS_PER_CAP;
                scale = 1.0f;
              } else {
                // Sub-pixel: total cap output ~= max_c * LEDS_PER_CAP in
                // LED-channel units. Round to an integer LED count and
                // scale so the max channel hits the 1/255 floor exactly.
                n = (int)roundf(max_c * (float)LEDS_PER_CAP);
                if (n < 1) n = 1;
                if (n > LEDS_PER_CAP) n = LEDS_PER_CAP;
                scale = 1.0f / max_c;
              }
              // roundf() before the uint8_t cast: in float32, X*scale
              // for the sub-pixel branch (e.g. X=1/3, scale=1/(1/3))
              // lands at 0.99999988, which truncates to PWM 0 and
              // makes the dark-band floor invisible. Round to nearest
              // so 0.99999988 -> 1 and the floor stays at PWM 1.
              Color on_c((uint8_t)fminf(255.0f, roundf(c.r * scale)),
                         (uint8_t)fminf(255.0f, roundf(c.g * scale)),
                         (uint8_t)fminf(255.0f, roundf(c.b * scale)));
              for (int i = 0; i < LEDS_PER_CAP; i++) {
                it[base + i] = (i < n) ? on_c : off_c;
              }
            };

            int mode = id(clock_mode);
            float t_ms = (float)millis();

            // Effective display brightness (0..1). Sourced from the
            // display_b global, NOT from current_values.get_brightness():
            // the light is held at 100% framework brightness so
            // addressable_light's color correction is a no-op, and we
            // do all dimming ourselves here. See the on_boot /
            // on_turn_on actions and the apply_auto_brightness script
            // for how display_b is driven.
            float user_brightness = id(display_b);

            // Hard max-brightness cap. eff_brightness is the user's
            // brightness clamped to max_b; primary and rainbow are
            // both built from eff_brightness so the cap applies
            // uniformly across modes without any second scaling pass.
            // Safety: if max_brightness is out of the slider's range
            // (e.g. a corrupted preference came back as 0), fall back
            // to the safe default instead of blanking the display or
            // lifting the cap entirely. on_boot also clamps to this
            // same value.
            float max_b = id(max_brightness);
            if (max_b < 0.3f || max_b > 1.0f) max_b = 0.85f;
            float eff_brightness = user_brightness < max_b ? user_brightness
                                                           : max_b;

            // HSV->RGB that keeps values as floats in 0..255. Letting
            // paint_cap do the final cast preserves sub-1 channel values
            // for the sub-pixel dimming path.
            auto hsv_to_fc = [](float h, float s, float v) -> FC {
              h = h - floorf(h);
              float r = 0, g = 0, b = 0;
              int i = (int)(h * 6.0f);
              float f = h * 6.0f - i;
              float p = v * (1.0f - s);
              float q = v * (1.0f - f * s);
              float u = v * (1.0f - (1.0f - f) * s);
              switch (i % 6) {
                case 0: r = v; g = u; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = u; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = u; g = p; b = v; break;
                case 5: r = v; g = p; b = q; break;
              }
              return FC{r * 255.0f, g * 255.0f, b * 255.0f};
            };

            auto scale_fc = [](FC c, float k) -> FC {
              if (k < 0.0f) k = 0.0f;
              return FC{c.r * k, c.g * k, c.b * k};
            };

            // Brightness mapping (0..255 from HA):
            //   0     -> off
            //   1..3  -> 1, 2, 3 LEDs lit per cap, all at PWM 1
            //   >= 4  -> 3 LEDs lit per cap, PWM = B - 2
            // This extends the dimmest visible range by 3 sub-steps
            // below what a single LED at PWM 1 can do alone. The
            // (3 -> 6) jump from B=3 to B=4 doesn't matter at this
            // level. We feed paint_cap an FC whose max channel = X,
            // and let paint_cap's existing thresholds take it from
            // there:
            //   X = 0.333 -> n=1, PWM=1
            //   X = 0.667 -> n=2, PWM=1
            //   X = 1.0   -> n=3, PWM=1   (Normal path)
            //   X = 2.0   -> n=3, PWM=2   (Normal path)
            //   ...
            int B = (int)roundf(eff_brightness * 255.0f);
            float X;
            if (B <= 0)      X = 0.0f;
            else if (B <= 3) X = (float)B / 3.0f;
            else             X = (float)(B - 2);

            auto &vals = id(clock_leds).current_values;
            float cb = vals.get_color_brightness();
            FC primary{vals.get_red()   * cb * X,
                       vals.get_green() * cb * X,
                       vals.get_blue()  * cb * X};
            // Bicolor secondary = primary with channels rotated
            // R<-G<-B<-R. Brightness-preserving and visibly distinct.
            FC minutes_fc{primary.g, primary.b, primary.r};

            auto color_for = [&](int x, int logical_d) -> FC {
              switch (mode) {
                case 1: { // Rainbow: hue = position + 30s drift.
                  // hsv_to_fc returns 0..255; scale by X/255 so the
                  // max channel lands at X (same brightness model as
                  // primary), keeping rainbow consistent with the
                  // sub-pixel mapping in paint_cap.
                  float h = ((float)x / DISPLAY_W) - (t_ms / 30000.0f);
                  return scale_fc(hsv_to_fc(h, 1.0f, 1.0f),
                                  X / 255.0f);
                }
                case 2: { // Bicolor: hours = primary, minutes = rotated.
                  // Colon (logical_d == -1) alternates each blink so the
                  // dots cycle between the two colors over time.
                  FC base;
                  if (logical_d == -1) {
                    int blink = (int)(t_ms / 2000.0f);
                    base = (blink & 1) ? minutes_fc : primary;
                  } else if (logical_d == 2 || logical_d == 3) {
                    base = minutes_fc;
                  } else {
                    base = primary;
                  }
                  return base;
                }
                case 3: { // Waves: visible brightness sweep + gentle hue drift.
                  // Brightness floor is 0.5 so digits with few lit caps
                  // (notably "1") stay readable through the dip. Range
                  // 0.5..1.0.
                  float w = 0.75f + 0.25f * sinf((float)x * 0.6f -
                                                 t_ms / 1200.0f);
                  // Color shift: cross-blend up to 20% with a channel-
                  // rotated copy of the user color. Subtle hue motion that
                  // stays anchored to the chosen color.
                  float c = 0.10f + 0.10f * sinf((float)x * 0.4f -
                                                 t_ms / 2500.0f);
                  FC alt{primary.b, primary.r, primary.g};
                  FC mixed{primary.r * (1.0f - c) + alt.r * c,
                           primary.g * (1.0f - c) + alt.g * c,
                           primary.b * (1.0f - c) + alt.b * c};
                  return scale_fc(mixed, w);
                }
                default:  // Mono
                  return primary;
              }
            };

            // 180-degree rotation: swap digit order and flip (row, col).
            // Mode coloring uses logical/visible coordinates so gradients
            // always read correctly regardless of rotation.
            bool rotate = id(rotate_180);
            for (int d = 0; d < 4; d++) {
              int phys_d = rotate ? (3 - d) : d;
              int offset = DIGIT_OFFSET[phys_d];
              int n = digits[d];
              for (int row = 0; row < 5; row++) {
                for (int col = 0; col < 3; col++) {
                  if (DIGITS[n][row][col] == '1') {
                    int phys_row = rotate ? (4 - row) : row;
                    int phys_col = rotate ? (2 - col) : col;
                    int x = DIGIT_X_OFFSET[d] + col;
                    paint_cap(offset + ROW_COL_TO_CAP[phys_row][phys_col],
                              color_for(x, d));
                  }
                }
              }
            }

            // Colon: light caps 1 and 3 of the 5-cap column with a 0.5 Hz
            // (2 s period) cosine fade in the active mode's color.
            float phase = (millis() % 2000) / 2000.0f;
            float fade = 0.5f * (1.0f - cosf(phase * 2.0f * 3.14159265f));
            FC colon_base = color_for(COLON_X, -1);
            FC colon_color = scale_fc(colon_base, fade);
            paint_cap(COLON_OFFSET + 1, colon_color);
            paint_cap(COLON_OFFSET + 3, colon_color);
